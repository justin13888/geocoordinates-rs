[package]
name = "geocoordinates"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A feature-complete geospatial coordinate library: China datums (GCJ-02/BD-09), geodetic transforms, geodesics, ingestion, and presentation."
authors = ["Justin Chung"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/justin13888/geocoordinates-rs"
readme = "README.md"
keywords = ["gis", "geo", "coordinates", "gcj02", "geodesy"]
categories = ["science::geo", "mathematics", "parser-implementations"]
# Contributor-facing files and the Swift package (which lives at the repo root for
# SwiftPM) are not part of the published crate.
exclude = ["AGENTS.md", "CLAUDE.md", "ROADMAP.md", "PUBLISHING.md", "Package.swift", "swift"]

# The repo is a workspace so the FFI bindings live in their own crate
# (`geocoordinates-ffi`) without touching this published, pure-`rlib` crate.
# The root package auto-joins as a member; `default-members = ["."]` keeps bare
# `cargo build/test/clippy/llvm-cov` scoped to this crate only, so the FFI crate
# (built explicitly via `-p geocoordinates-ffi`) never perturbs core CI/coverage.
[workspace]
members = ["crates/geocoordinates-ffi"]
default-members = ["."]
resolver = "3"

[dependencies]
geo = "0.33.1"
geo-types = "0.7.19"
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.18"
tracing = "0.1.44"

[features]
default = []
# Enable serde Serialize/Deserialize on this crate's types and on the underlying geo-types.
serde = ["dep:serde", "geo-types/serde", "geo/serde"]

# --- Staged features (see ROADMAP.md) ---
# The optional capabilities below are commented out until their modules are
# implemented and released. Uncomment each line as its ROADMAP milestone lands
# (alongside the matching `pub mod` in src/lib.rs). They gate nothing while their
# modules are commented out, so leaving them defined would only advertise
# panicking APIs.
#
# Interchange formats (parsers/writers):
# geojson = ["serde"] # GeoJSON (lon-lat axis order) — serde_json / geojson crate
# wkt = []            # WKT/WKB — wkt crate
# gpx = []            # GPX track files — gpx crate
# kml = []            # KML/KMZ — kml crate
#
# Sensor / device ingestion:
# nmea = []           # NMEA 0183 sentences — nmea parser crate
# exif = []           # EXIF/XMP image GPS metadata — kamadak-exif
#
# Heavy / external integrations:
# proj = []           # PROJ-backed EPSG long tail — proj crate (C dep)
# geoid = []          # EGM96/EGM2008 geoid models — bundled/loaded grid data
# h3 = []             # Uber H3 indexing — h3o crate
# s2 = []             # Google S2 indexing — s2 crate
#
# Convenience: enable every optional capability (restore entries as they return).
# full = ["serde", "geojson", "wkt", "gpx", "kml", "nmea", "exif", "proj", "geoid", "h3", "s2"]
