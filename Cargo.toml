[package]
name = "geocoordinates"
version.workspace = true
edition = "2024"
rust-version = "1.85"
description = "Low-level geospatial coordinate primitives: China datums (GCJ-02/BD-09), angle encodings, coordinate parsing/formatting, and geodesy utilities."
authors = ["Justin Chung"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/justin13888/geocoordinates-rs"
readme = "README.md"
keywords = ["gis", "geo", "coordinates", "gcj02", "geodesy"]
categories = ["science::geo", "mathematics", "parser-implementations"]
# An allow-list, so a new contributor file (CI, tool config, baselines, the Swift
# package at the repo root) stays out of the published crate without anyone having
# to remember an exclude entry. Cargo adds Cargo.toml and Cargo.lock itself. The
# flagship example is left out too: it needs every feature and is CI's concern, so
# `cargo package` drops its target with a warning.
include = ["/src/**/*.rs", "/LICENSE-APACHE", "/LICENSE-MIT", "/README.md", "/CHANGELOG.md"]

# docs.rs builds with every feature, so each feature-gated item is documented, and
# sets `--cfg docsrs`, which turns on the `doc(cfg(...))` badges naming the feature
# each gated item needs (see `src/lib.rs`).
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Per-feature MSRV exceptions. `rust-version` above covers the core crate and every
# feature not listed here; each listed feature needs the newer rustc its upstream
# dependency requires (geojson 1.0 uses `if let` chains; h3o 0.10 calls
# `f64::mul_add` in a `const fn`). Cargo has no per-feature `rust-version`, so this
# table is the record: `mise run msrv` reads it and tests each feature on its own
# toolchain, so the declaration cannot drift from what builds. Keep one
# `feature = "version"` entry per line.
[package.metadata.feature-rust-version]
geojson = "1.88"
h3 = "1.94"

# The repo is a workspace so the FFI bindings live in their own crate
# (`geocoordinates-ffi`) without touching this published, pure-`rlib` crate.
# The root package auto-joins as a member; `default-members = ["."]` keeps bare
# `cargo build/test/clippy/llvm-cov` scoped to this crate only, so the FFI crate
# (built explicitly via `-p geocoordinates-ffi`) never perturbs core CI/coverage.
[workspace]
members = ["crates/geocoordinates-ffi"]
default-members = ["."]
resolver = "3"

# The one version every artifact of a release ships: both crates inherit it
# (`version.workspace = true`), so release-plz bumps it once for both. The Python
# wheel reads it through the FFI crate (maturin), the JVM build reads it from this
# line, and the npm manifest carries a copy that `mise run version-sync` writes
# and `mise run version-check` holds to it. Keep it the only `version = "..."`
# line at the start of a line in this file: the release workflows stamp and read
# it by that pattern.
[workspace.package]
version = "0.14.2"

# Every `pub` item needs a doc comment (see CLAUDE.md). `warn` keeps local
# iteration unblocked; CI's `RUSTFLAGS="-D warnings"` and clippy's `-D warnings`
# turn it into a hard failure.
[lints.rust]
missing_docs = "warn"

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.18"
geographiclib-rs = { version = "0.2", default-features = false } # Karney geodesic engine

# Interchange-format parsers (feature-gated — see [features]).
geojson = { version = "1.0", optional = true }
wkt = { version = "0.14", optional = true }
gpx = { version = "0.10", optional = true }
# Named only to convert a GPX `<time>` (a `time::OffsetDateTime`) into a
# `SystemTime`; gpx already depends on it, so it adds no crate to the build.
time = { version = "0.3", optional = true, default-features = false, features = ["std"] }
# `default-features = false` drops the `zip` (KMZ) backend, which pulls a C zstd
# dependency that is not wasm-clean; this crate parses text KML, not KMZ.
kml = { version = "0.13", optional = true, default-features = false }

# Discrete global grid indexing (feature-gated — see [features]).
h3o = { version = "0.10", optional = true }
s2 = { version = "0.0.13", optional = true, default-features = false }

[dev-dependencies]
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = "1.0.150"

[features]
default = []
# Enable serde Serialize/Deserialize on this crate's value/option/id types.
serde = ["dep:serde"]

# --- Optional capabilities ---
# Each feature below is implemented, tested and released. The core path (angles,
# format, parse, Plus Code) needs no cargo features at all. EXIF ingestion is out
# of scope entirely — it lives in a separate library that consumes this crate's
# primitives.
#
# Interchange formats (parsers):
geojson = ["dep:geojson"] # GeoJSON (lon-lat axis order)
wkt = ["dep:wkt"] # WKT (axis order stated by the caller)
gpx = ["dep:gpx", "dep:time"] # GPX track / waypoint files
kml = ["dep:kml"] # KML placemark documents
#
# Sensor / device ingestion:
nmea = [] # NMEA 0183 sentences (GGA/RMC/GLL), hand-rolled — no external dep
#
# Discrete global grid indexing:
h3 = ["dep:h3o"] # Uber H3 indexing
s2 = ["dep:s2"] # Google S2 indexing
#
# Heavy / external integrations (BLOCKED — see STABILIZATION.md). Neither has
# any source in-tree; these placeholders only record the intended feature names:
# proj = []           # PROJ-backed EPSG long tail — needs system libproj (C dep)
# geoid = []          # EGM96/EGM2008 geoid models — needs multi-MB grid data files

[[example]]
name = "flagship"
test = true
required-features = ["serde", "geojson", "wkt", "gpx", "kml", "nmea", "h3", "s2"]
