# Dev tools pinned for reproducible local + CI runs, plus every project task.
# `.mise.toml` is inert unless mise is installed, so a system-installed toolchain
# is unaffected. Run `mise install` to provision the tools and the git hooks,
# `mise tasks` to list the tasks, and `mise run <task>` to invoke one.

# Tools every invocation needs. cargo-mutants and convco are deliberately not
# here: neither has a usable prebuilt asset, so both compile from source, and a
# global pin would make every CI job pay for them. They are declared on the
# tasks that use them instead, and install on first run.
[tools]
# Git hooks manager. `hk.pkl` repeats this same version twice, in its `amends`
# URL and in `min_hk_version`, so bump all three together.
hk = "1.57.0"

[env]
# Wrap the generated git hooks in `mise x`, so they resolve the pinned tools
# even when the shell has no mise activation.
HK_MISE = "1"
# Deny rustc warnings in every task, matching the workflow-level `RUSTFLAGS` in
# ci.yml and ffi.yml, so `mise run test`, `coverage`, and `bindings-build` fail
# locally on the same warnings CI does. mise's value takes precedence over the
# calling environment, so the tasks CI relaxes (`mutants`, `mutants-all`,
# `bindings-web`) reset it on the task itself.
RUSTFLAGS = "-D warnings"

[hooks]
# Install the git hooks as part of `mise install`, so a fresh clone is gated
# after a single command.
postinstall = "hk install --mise"

[vars]
# Central flags shared by both mutation tasks: published crate only, all features.
mutants_flags = "--package geocoordinates --all-features"
# Nightly whose rustdoc JSON the public API tasks read.
public_api_toolchain = "nightly-2026-09-25"
# Line limit for every tracked file not listed in `.file-length-baseline`.
max_file_lines = "654"
# Shell function shared by the coverage tasks: reads a `.coverage-baseline`
# file on stdin and prints its floor, or fails when the file holds anything but
# comments, blank lines, and exactly one whole percent from 0 to 100. Its one
# argument names the file in error messages.
coverage_floor_fn = '''
coverage_floor() {
    awk -v src="$1" '
        /^[[:space:]]*(#|$)/ { next }
        /^[0-9]+$/ && $0 + 0 <= 100 && !n { floor = $0 + 0; n = 1; next }
        { printf "coverage: malformed line in %s: %s\n", src, $0 > "/dev/stderr"; bad = 1 }
        END {
            if (!bad && !n) { printf "coverage: %s sets no floor\n", src > "/dev/stderr"; bad = 1 }
            if (bad) exit 1
            print floor
        }'
}
'''

[tasks.default]
description = "List available tasks"
run = "mise tasks"

# --- Formatting, linting, tests ---

[tasks.fmt]
description = "Format all code"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check formatting without modifying files"
run = "cargo fmt --check"

[tasks.lint]
description = "Lint with clippy (warnings denied)"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Lint and auto-fix where possible"
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features"

[tasks.test]
description = "Run the test suite"
run = "cargo test --all-features"

# Builds and tests on the `rust-version` declared in Cargo.toml, read at run time
# so the check cannot drift from the declaration. `--locked` proves the committed
# Cargo.lock resolves on that toolchain. The features in Cargo.toml's
# `[package.metadata.feature-rust-version]` table (`geojson`, `h3`) are left out of
# the core run: each is then tested alone on the newer toolchain that table
# declares for it, read the same way.
[tasks.msrv]
description = "Build and test on the declared MSRV, and each feature MSRV exception on its own"
run = '''
#!/usr/bin/env bash
set -euo pipefail
msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
if [ -z "$msrv" ]; then
    echo "msrv: no rust-version in Cargo.toml" >&2
    exit 1
fi
rustup toolchain install "$msrv" --profile minimal --no-self-update
cargo "+$msrv" test --locked --features serde,wkt,gpx,kml,nmea,s2,index,exif,cluster,reverse-bundled,map,geotag,privacy

exceptions="$(sed -n '/^\[package\.metadata\.feature-rust-version\]$/,/^\[/ s/^\([a-z0-9_-]*\) = "\(.*\)"$/\1 \2/p' Cargo.toml)"
if [ -z "$exceptions" ]; then
    echo "msrv: no [package.metadata.feature-rust-version] entries in Cargo.toml" >&2
    exit 1
fi
while read -r feature version; do
    rustup toolchain install "$version" --profile minimal --no-self-update < /dev/null
    cargo "+$version" test --locked --features "$feature" < /dev/null
done <<< "$exceptions"
'''

# Every other task enables `--all-features`, so a feature that only builds next
# to another (a missing `dep:` entry, an import or cfg that leans on a sibling
# feature) would go unnoticed there. This builds the library once with no
# features and once with each feature alone, then runs the test suite with no
# features, the configuration a default `cargo add geocoordinates` gets.
# cargo-hack ships prebuilt binaries, so the pin downloads one rather than
# compiling from source.
[tasks.features]
description = "Check the library with no features and each feature alone; test with none"
tools = { "github:taiki-e/cargo-hack" = "0.6.45" }
run = [
    "cargo hack --each-feature --no-dev-deps check",
    "cargo test --no-default-features",
]

# The per-feature job for `index`: its tests and doctests with no sibling feature
# on, and its benchmark target compiled, since no other gate builds benches alone.
[tasks.index-test]
description = "Test the index feature alone and compile its benchmark"
run = [
    "cargo test --no-default-features --features index",
    "cargo bench --no-run --no-default-features --features index --bench spatial_index",
]

# The per-feature job for `exif`: its tests and doctests with no sibling feature on.
[tasks.exif-test]
description = "Test the exif feature alone"
run = "cargo test --no-default-features --features exif"

# The per-feature job for `cluster`: its tests and doctests with no sibling feature
# beyond the `index` it builds on, and its benchmark target compiled.
[tasks.cluster-test]
description = "Test the cluster feature alone and compile its benchmark"
run = [
    "cargo test --no-default-features --features cluster",
    "cargo bench --no-run --no-default-features --features cluster --bench cluster",
]

# The per-feature jobs for `reverse` and `reverse-bundled`: each one's tests and
# doctests with no sibling feature beyond the `index` it builds on, the build
# tool's own tests (its writer is the format the loader reads), and the benchmark
# target compiled.
[tasks.reverse-test]
description = "Test the reverse and reverse-bundled features alone and compile their benchmark"
run = [
    "cargo test --no-default-features --features reverse",
    "cargo test --no-default-features --features reverse-bundled",
    "cargo test -p geocoordinates-gazetteer",
    "cargo bench --no-run --no-default-features --features reverse-bundled --bench reverse",
]

# The per-feature job for `map`: its tests and doctests with no sibling feature
# beyond the `cluster` it builds on, then again with `geojson`, which its GeoJSON
# layers need.
[tasks.map-test]
description = "Test the map feature alone, and with geojson for its layers"
run = [
    "cargo test --no-default-features --features map",
    "cargo test --no-default-features --features map,geojson",
]

# The per-feature job for `geotag`: its tests and doctests with no sibling feature
# on, then again with `gpx`, which its golden track file is read through.
[tasks.geotag-test]
description = "Test the geotag feature alone, and with gpx for its golden track"
run = [
    "cargo test --no-default-features --features geotag",
    "cargo test --no-default-features --features geotag,gpx",
]

# The per-feature job for `privacy`: its tests and doctests with no sibling feature
# on (geohash snapping only), then again with `h3`,
# `s2` and `serde`, which add its H3 and S2 grids and its wire forms.
[tasks.privacy-test]
description = "Test the privacy feature alone, and with h3, s2 and serde"
run = [
    "cargo test --no-default-features --features privacy",
    "cargo test --no-default-features --features privacy,h3,s2,serde",
]

# Both coverage tasks fail when total line coverage falls under the floor in
# `.coverage-baseline`; `coverage-ratchet` keeps that floor from falling.
[tasks.coverage]
description = "Report code coverage; fail under the line floor in .coverage-baseline"
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.coverage_floor_fn }}
floor="$(coverage_floor .coverage-baseline < .coverage-baseline)"
cargo llvm-cov --all-features --fail-under-lines "$floor"
'''

# CI's two-step form: an lcov artifact plus a human-readable summary. The lcov
# file is written before the floor is checked, so a failing run still leaves it.
[tasks.coverage-lcov]
description = "Report coverage as lcov.info plus a summary; fail under the line floor (CI)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.coverage_floor_fn }}
floor="$(coverage_floor .coverage-baseline < .coverage-baseline)"
cargo llvm-cov --all-features --lcov --output-path lcov.info
cargo llvm-cov report --summary-only --fail-under-lines "$floor"
'''

# The floor in `.coverage-baseline` may only rise: it fails below [base]'s, on a
# missing file, and on an unresolved [base] under `CI=true` (locally it warns and
# skips). A base that predates the file has nothing to compare, and passes.
[tasks.coverage-ratchet]
description = "Fail when the coverage floor in .coverage-baseline falls below the base's"
usage = 'arg "[base]" help="Ref whose coverage floor this one may not fall below" default="origin/master"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
{{ vars.coverage_floor_fn }}
baseline=".coverage-baseline"
base="${usage_base:-origin/master}"
if [ ! -f "$baseline" ]; then
    echo "coverage-ratchet: $baseline is missing" >&2
    exit 1
fi
floor="$(coverage_floor "$baseline" < "$baseline")"
if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
    [ "${CI:-}" = true ] && { echo "coverage-ratchet: no '$base' ref under CI" >&2; exit 1; }
    echo "coverage-ratchet: warning: no '$base' ref; skipping the comparison." >&2
    exit 0
fi
if ! base_file="$(git show "$base:$baseline" 2>/dev/null)"; then
    echo "coverage-ratchet: $base has no $baseline; skipping the comparison."
    exit 0
fi
base_floor="$(coverage_floor "$base:$baseline" <<< "$base_file")"
if [ "$floor" -lt "$base_floor" ]; then
    echo "coverage-ratchet: floor lowered from $base_floor% to $floor% vs $base; the floor may only rise" >&2
    exit 1
fi
echo "coverage-ratchet: floor $floor% is at or above $base's $base_floor%."
'''

# --- Public API shape ---

# Both read rustdoc's JSON, which only a nightly emits; the nightly is pinned so
# the format cannot drift, and cargo-public-api (no prebuilt asset, so pinned on
# the tasks) to a release that reads it: bump the two together. The snapshots
# record the whole surface; `scripts/public_api_snapshot.py` says what and how.
[tasks.public-api-snapshot]
description = "Regenerate the public API snapshots in public-api/"
tools = { "cargo:cargo-public-api" = "0.52.0" }
env = { RUSTFLAGS = "" } # nightly-only lints are not this gate's concern
run = [
    "rustup toolchain install {{ vars.public_api_toolchain }} --profile minimal --no-self-update",
    "python3 -I scripts/public_api_snapshot.py {{ vars.public_api_toolchain }}",
]

# One path per item besides its prelude entry, no fewer items than the floor in
# `scripts/check_public_paths.py`, and no drift from the snapshots.
[tasks.public-api-check]
description = "Fail on a duplicate public path, too few items, or drift from public-api/"
tools = { "cargo:cargo-public-api" = "0.52.0" }
env = { RUSTFLAGS = "" } # nightly-only lints are not this gate's concern
run = '''
#!/usr/bin/env bash
set -euo pipefail
toolchain="{{ vars.public_api_toolchain }}"
rustup toolchain install "$toolchain" --profile minimal --no-self-update
cargo "+$toolchain" rustdoc -q -p geocoordinates --lib --all-features -- \
    -Z unstable-options --output-format json
python3 -I scripts/check_public_paths.py target/doc/geocoordinates.json
python3 -I scripts/public_api_snapshot.py "$toolchain" --check
'''

# --- Release versions ---

# Every artifact of a release ships the workspace version in Cargo.toml
# (`[workspace.package] version`). Both crates inherit it, maturin reads it for
# the Python wheel, and the JVM build reads it from Cargo.toml, so none may hold
# a second copy; this fails if one does. The npm manifest must hold a literal
# version, a copy `version-sync` writes and this holds to the workspace version.
[tasks.version-check]
description = "Fail when a crate or binding manifest's version is not the workspace version"
run = '''
#!/usr/bin/env bash
set -euo pipefail
python3 -I - <<'PY'
import json
import pathlib
import re
import sys
import tomllib

def read(path):
    return pathlib.Path(path).read_text(encoding="utf-8")

version = tomllib.loads(read("Cargo.toml")).get("workspace", {}).get("package", {}).get("version")
if not isinstance(version, str):
    sys.exit("version-check: Cargo.toml has no [workspace.package] version")

errors = []
for path in ("Cargo.toml", "crates/geocoordinates-ffi/Cargo.toml"):
    if tomllib.loads(read(path))["package"].get("version") != {"workspace": True}:
        errors.append(f"{path}: [package] must say `version.workspace = true`")

web = "crates/geocoordinates-ffi/web"
manifest = json.loads(read(f"{web}/package.json"))
lock = json.loads(read(f"{web}/package-lock.json"))
for where, found in (
    (f"{web}/package.json", manifest.get("version")),
    (f"{web}/package-lock.json", lock.get("version")),
    (f'{web}/package-lock.json packages[""]', lock.get("packages", {}).get("", {}).get("version")),
):
    if found != version:
        errors.append(f"{where}: version {found!r}, not the workspace version {version!r}")

project = tomllib.loads(read("crates/geocoordinates-ffi/pyproject.toml"))["project"]
if "version" in project or "version" not in project.get("dynamic", []):
    errors.append("crates/geocoordinates-ffi/pyproject.toml: version must be dynamic (maturin reads the FFI crate's)")

gradle = "crates/geocoordinates-ffi/jvm/build.gradle.kts"
if re.search(r'^\s*(?:project\.)?version\s*=.*"[0-9]', read(gradle), re.MULTILINE):
    errors.append(f"{gradle}: the project version holds a literal; read it from Cargo.toml")

if errors:
    print("\n".join(errors), file=sys.stderr)
    print("version-check: run `mise run version-sync` for the npm manifest", file=sys.stderr)
    sys.exit(1)
print(f"version-check: every manifest ships {version}")
PY
'''

# Writes the workspace version into the npm manifest and its lockfile. The
# release PR workflow runs it after release-plz bumps Cargo.toml.
[tasks.version-sync]
description = "Stamp the npm manifest with the workspace version from Cargo.toml"
run = '''
#!/usr/bin/env bash
set -euo pipefail
version="$(sed -n '/^\[workspace\.package\]$/,/^\[/ s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
if [ -z "$version" ]; then
    echo "version-sync: Cargo.toml has no [workspace.package] version" >&2
    exit 1
fi
cd crates/geocoordinates-ffi/web
npm version "$version" --no-git-tag-version --allow-same-version >/dev/null
echo "version-sync: npm manifest set to $version"
'''

[tasks.build]
description = "Build the crate"
run = "cargo build --all-features"

[tasks.doc]
description = "Build documentation"
run = "cargo doc --no-deps --all-features"

# Run in series: parallel cargo invocations contend on the target-dir lock.
[tasks.check]
description = "core gates: fmt-check + lint + test"
run = ["mise run fmt-check", "mise run lint", "mise run test"]

[tasks.scripts-test]
description = "Fixture tests for scripts/check_public_paths.py and the gate tasks here"
run = "python3 -I -B -m unittest discover -s scripts/tests"

# --- File length ---

# Fails any tracked file over `max_file_lines` unless `.file-length-baseline`
# lists it, and holds every listed file to its recorded length. Against [base],
# which must resolve under `CI=true`, the baseline may only shrink: no new entry,
# raised cap, or raised `max_file_lines`. The check is scripts/file_length_check.sh.
[tasks.file-length-check]
description = "Fail files over the line limit unless baselined; the baseline may only shrink"
usage = 'arg "[base]" help="Ref whose baseline this one may not exceed" default="origin/master"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec bash "{{ config_root }}/scripts/file_length_check.sh" "{{ vars.max_file_lines }}" "${usage_base:-origin/master}"
'''

# --- Mutation testing (cargo-mutants) ---

# A line-anchored `exclude_re` entry (`'src/...rs:LINE:...'`) names one expression
# on that line, written in the `# anchor: TEXT` comment directly above it. Fails
# when an anchored entry has no such comment, when TEXT is not on LINE of its
# file, or when the entry matches none of the mutants cargo-mutants lists without
# the config, so an edit that moves the line cannot silently re-aim the entry.
[tasks.mutants-anchor-check]
description = "Fail when a line-anchored mutation exclusion no longer names its expression"
tools = { "cargo:cargo-mutants" = "27.1.0" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
python3 -I - <<'PY'
import pathlib
import re
import subprocess
import sys
import tomllib

CONFIG = ".cargo/mutants.toml"
text = pathlib.Path(CONFIG).read_text(encoding="utf-8")
# `--colors never`: CI sets CARGO_TERM_COLOR=always, which cargo-mutants reads,
# and ANSI escapes in the listing would keep every entry from matching.
command = ["cargo", "mutants", *"{{ vars.mutants_flags }}".split(), "--list", "--no-config", "--colors", "never"]
listing = subprocess.run(command, stdout=subprocess.PIPE, text=True)
if listing.returncode != 0:
    sys.exit(f"mutants-anchor-check: `{' '.join(command)}` exited {listing.returncode}")
names = listing.stdout.splitlines()
entry = re.compile(r"^\s*'(?P<re>(?P<file>src/[^':]+):(?P<line>[0-9]+):[^']*)',?\s*$")
anchor = re.compile(r"^\s*# anchor: (?P<text>.+?)\s*$")

errors = []
found = []
pending = None
for number, line in enumerate(text.splitlines(), start=1):
    where = f"{CONFIG}:{number}"
    if pending is not None and not entry.match(line):
        errors.append(f"{pending[0]}: `# anchor:` is not directly above an anchored entry")
        pending = None
    if match := anchor.match(line):
        pending = (where, match["text"])
        continue
    if not (match := entry.match(line)):
        continue
    found.append(match["re"])
    if pending is None:
        errors.append(f"{where}: anchored entry has no `# anchor:` comment directly above it")
        continue
    expression, pending = pending[1], None
    path = match["file"].replace("\\.", ".")
    if re.search(r"[\\()\[\]|*+?{}^$]", path):
        errors.append(f"{where}: anchored file `{match['file']}` is not a plain path")
        continue
    source = pathlib.Path(path)
    lines = source.read_text(encoding="utf-8").splitlines() if source.is_file() else []
    at = int(match["line"])
    if at > len(lines) or expression not in lines[at - 1]:
        errors.append(f"{where}: `{expression}` is not on {path}:{at}; re-anchor the entry")
    elif not any(re.search(match["re"], name) for name in names):
        errors.append(f"{where}: matches no mutant cargo-mutants lists; re-anchor the entry")
if pending is not None:
    errors.append(f"{pending[0]}: `# anchor:` is not directly above an anchored entry")

# Every entry the config holds that names a line must have been read above.
expected = [r for r in tomllib.loads(text)["exclude_re"] if re.match(r"src/[^:]+:[0-9]+:", r)]
if expected != found:
    errors.append(f"{CONFIG}: an anchored entry is not written on a line of its own")

if errors:
    sys.exit("mutants-anchor-check:\n  " + "\n  ".join(errors))
print(f"mutants-anchor-check: {len(found)} anchored exclusions name their expressions")
PY
'''

[tasks.mutants]
description = "Mutation-test only the lines changed vs trunk (CI gate)"
depends = ["mutants-anchor-check"]
tools = { "cargo:cargo-mutants" = "27.1.0" }
# Warn-only mutants must still build to be evaluated, else they count as
# unviable rather than missed (CI's `mutants` job relaxes it the same way).
env = { RUSTFLAGS = "" }
usage = 'arg "[base]" help="Base ref to diff against" default="origin/master"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
base="${usage_base:-origin/master}"
if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
    if git rev-parse --verify --quiet "master^{commit}" >/dev/null; then
        base="master"
    else
        echo "mutants: no '$base' or 'master' ref found; skipping." >&2
        exit 0
    fi
fi
diff="$(mktemp)"
trap 'rm -f "$diff"' EXIT
git diff "$base"...HEAD -- '*.rs' > "$diff"
if [ ! -s "$diff" ]; then
    echo "mutants: no Rust changes vs $base; nothing to test."
    exit 0
fi
cargo mutants {{ vars.mutants_flags }} --in-diff "$diff"
'''

[tasks.mutants-all]
description = "Full-tree mutation test of the published crate (slow, may report gaps)"
depends = ["mutants-anchor-check"]
tools = { "cargo:cargo-mutants" = "27.1.0" }
env = { RUSTFLAGS = "" } # as in `mutants`
run = "cargo mutants {{ vars.mutants_flags }}"

# --- Commit message linting (Conventional Commits via convco) ---

# `--from-stdin` reads one message (convco otherwise walks history); `--strip`
# drops the comment/whitespace lines git leaves in the message file.
[tasks.commit-check]
description = "Lint a single commit message file (used by the commit-msg hook)"
tools = { "cargo:convco" = "0.6.4" }
usage = 'arg "<file>" help="Path to the commit message file"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
convco check --from-stdin --strip < "$usage_file"
'''

[tasks.commits-check]
description = "Lint that commits in <range> follow Conventional Commits (pre-push + CI)"
tools = { "cargo:convco" = "0.6.4" }
usage = 'arg "[range]" help="Commit range to lint" default="origin/master..HEAD"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
range="${usage_range:-origin/master..HEAD}"
# Resolve a base when origin/master isn't fetched (fresh clone / CI quirks),
# mirroring the `mutants` task's guard. Explicit ranges (CI) bypass this.
if [[ "$range" == "origin/master..HEAD" ]] \
   && ! git rev-parse --verify --quiet "origin/master^{commit}" >/dev/null; then
    if git rev-parse --verify --quiet "master^{commit}" >/dev/null; then
        range="master..HEAD"
    else
        echo "commits-check: no origin/master or master ref; skipping." >&2
        exit 0
    fi
fi
convco check "$range"
'''

# --- FFI bindings (geocoordinates-ffi) ---
# The tasks above are scoped to the published crate via `default-members`;
# the FFI crate is built/linted explicitly here.

[tasks.ffi-check]
description = "Lint the FFI bindings crate (warnings denied)"
run = "cargo clippy -p geocoordinates-ffi --all-targets -- -D warnings"

[tasks.ffi-test]
description = "Run the FFI bindings crate's Rust tests"
run = "cargo test -p geocoordinates-ffi"

[tasks.bindings-build]
description = "Build the release cdylib the bindings are generated from"
run = "cargo build --release -p geocoordinates-ffi"

[tasks.bindings-generate]
description = "Generate <lang> bindings from the built cdylib (UniFFI library mode)"
hide = true
usage = 'arg "<lang>" help="UniFFI backend to generate"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Shared library the bindings are generated from (OS-specific extension).
case "$(uname -s)" in
    Darwin) lib="target/release/libgeocoordinates_ffi.dylib" ;;
    *)      lib="target/release/libgeocoordinates_ffi.so" ;;
esac
# Swift is generated unformatted, as build-xcframework.sh does, so the copy
# committed under swift/ matches whether or not swift-format is installed.
format=()
[ "$usage_lang" = swift ] && format=(--no-format)
cargo run -q -p geocoordinates-ffi --bin uniffi-bindgen -- \
    generate ${format[@]+"${format[@]}"} --library "$lib" --language "$usage_lang" \
    --out-dir "bindings/$usage_lang"
'''

[tasks.bindings-python]
description = "Generate the Python bindings"
depends = ["bindings-build"]
run = "mise run bindings-generate python"

[tasks.bindings-kotlin]
description = "Generate the Kotlin bindings"
depends = ["bindings-build"]
run = "mise run bindings-generate kotlin"

# The generated tree already carries its package path (uniffi/...), so it is
# copied as is into the Gradle source set; ffi.yml and release-jvm.yml run this.
[tasks.bindings-jvm-stage]
description = "Generate the Kotlin bindings and stage them into the JVM Gradle project"
depends = ["bindings-kotlin"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
mkdir -p crates/geocoordinates-ffi/jvm/src/main/kotlin
cp -R bindings/kotlin/. crates/geocoordinates-ffi/jvm/src/main/kotlin/
'''

[tasks.bindings-swift]
description = "Generate the Swift bindings"
depends = ["bindings-build"]
run = "mise run bindings-generate swift"

# Not a built-in UniFFI backend: builds the crate to wasm32 via wasm-pack.
# Requires the `wasm32-unknown-unknown` target, `wasm-pack`, and Node.js.
[tasks.bindings-web]
description = "Generate the TypeScript / WebAssembly bindings (uniffi-bindgen-react-native)"
dir = "{{ config_root }}/crates/geocoordinates-ffi/web"
# The generated wrapper crate and wasm builds of third-party deps are not where
# warnings are denied (ffi.yml's `web-wasm` job relaxes it the same way).
env = { RUSTFLAGS = "" }
# `npm ci` installs exactly package-lock.json, as ffi.yml and release-web.yml
# (which run this task) need.
run = ["npm ci", "npm run build"]

# Java is served by the Kotlin/JVM artifact, so it has no separate generation.
[tasks.bindings]
description = "Generate bindings for every target language"
run = [
    "mise run bindings-python",
    "mise run bindings-kotlin",
    "mise run bindings-swift",
    "mise run bindings-web",
]
