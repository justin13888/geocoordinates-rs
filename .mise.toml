# Dev tools pinned for reproducible local + CI runs, plus every project task.
# `.mise.toml` is inert unless mise is installed, so a system-installed toolchain
# is unaffected. Run `mise install` to provision the tools and the git hooks,
# `mise tasks` to list the tasks, and `mise run <task>` to invoke one.

# Tools every invocation needs. cargo-mutants and convco are deliberately not
# here: neither has a usable prebuilt asset, so both compile from source, and a
# global pin would make every CI job pay for them. They are declared on the
# tasks that use them instead, and install on first run.
[tools]
# Git hooks manager. The matching `amends` URL in `hk.pkl` embeds this same
# version, so bump both together.
hk = "1.57.0"

[env]
# Wrap the generated git hooks in `mise x`, so they resolve the pinned tools
# even when the shell has no mise activation.
HK_MISE = "1"

[hooks]
# Install the git hooks as part of `mise install`, so a fresh clone is gated
# after a single command.
postinstall = "hk install --mise"

[vars]
# Central flags shared by both mutation tasks: published crate only, all features.
mutants_flags = "--package geocoordinates --all-features"
# Line limit for every tracked file not listed in `.file-length-baseline`.
max_file_lines = "654"

[tasks.default]
description = "List available tasks"
run = "mise tasks"

# --- Formatting, linting, tests ---

[tasks.fmt]
description = "Format all code"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check formatting without modifying files"
run = "cargo fmt --check"

[tasks.lint]
description = "Lint with clippy (warnings denied)"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.lint-fix]
description = "Lint and auto-fix where possible"
run = "cargo clippy --fix --allow-dirty --allow-staged --all-targets --all-features"

[tasks.test]
description = "Run the test suite"
run = "cargo test --all-features"

# Builds and tests on the `rust-version` declared in Cargo.toml, read at run time
# so the check cannot drift from the declaration. `--locked` proves the committed
# Cargo.lock resolves on that toolchain. `geojson` and `h3` are excluded: their
# dependencies (geojson 1.0, h3o 0.10) need a newer rustc than the core crate.
[tasks.msrv]
description = "Build and test on the declared MSRV (core + MSRV-clean features)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
if [ -z "$msrv" ]; then
    echo "msrv: no rust-version in Cargo.toml" >&2
    exit 1
fi
rustup toolchain install "$msrv" --profile minimal --no-self-update
cargo "+$msrv" test --locked --features serde,wkt,gpx,kml,nmea,s2
'''

[tasks.coverage]
description = "Report code coverage (no enforced threshold yet)"
run = "cargo llvm-cov --all-features"

# CI's two-step form: an lcov artifact plus a human-readable summary.
[tasks.coverage-lcov]
description = "Report coverage as lcov.info plus a summary (CI)"
run = [
    "cargo llvm-cov --all-features --lcov --output-path lcov.info",
    "cargo llvm-cov report --summary-only",
]

[tasks.build]
description = "Build the crate"
run = "cargo build --all-features"

[tasks.doc]
description = "Build documentation"
run = "cargo doc --no-deps --all-features"

# Run in series: parallel cargo invocations contend on the target-dir lock.
[tasks.check]
description = "core gates: fmt-check + lint + test"
run = ["mise run fmt-check", "mise run lint", "mise run test"]

# --- File length ---

# Fails any tracked file over `max_file_lines` unless `.file-length-baseline`
# lists it, and holds every listed file to its recorded length. Against [base],
# the baseline may only shrink: no new entries, no raised caps, and no raised
# `max_file_lines`. Plain awk and
# no associative arrays in bash, so it runs on macOS's stock bash 3.2 too.
[tasks.file-length-check]
description = "Fail files over the line limit unless baselined; the baseline may only shrink"
usage = 'arg "[base]" help="Ref whose baseline this one may not exceed" default="origin/master"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
max="{{ vars.max_file_lines }}"
baseline=".file-length-baseline"
base="${usage_base:-origin/master}"
if [ ! -f "$baseline" ]; then
    echo "file-length-check: $baseline is missing" >&2
    exit 1
fi
lengths="$(mktemp)"
base_baseline="$(mktemp)"
trap 'rm -f "$lengths" "$base_baseline"' EXIT

# "<lines> <path>" for every tracked regular file present in the worktree.
git ls-files -z | while IFS= read -r -d '' path; do
    if [ -f "$path" ] && [ ! -L "$path" ]; then
        printf '%s %s\n' "$(wc -l < "$path" | tr -d ' ')" "$path"
    fi
done > "$lengths"

# Parses a baseline file into cap[] and gen[]; shared by both passes below.
parse='
function parse_line(line, fields, n) {
    if (line ~ /^[[:space:]]*(#|$)/) return 0
    n = split(line, fields, /[[:space:]]+/)
    if (n != 2 || (fields[1] != "generated" && fields[1] !~ /^[0-9]+$/)) {
        printf "file-length-check: malformed baseline line: %s\n", line
        bad = 1
        return 0
    }
    kind = fields[1]; entry = fields[2]
    return 1
}'

status=0
awk -v max="$max" -v file="$baseline" "$parse"'
FNR == NR {
    if (!parse_line($0)) next
    if (kind == "generated") gen[entry] = 1; else cap[entry] = kind + 0
    next
}
{
    n = $1 + 0
    path = substr($0, index($0, " ") + 1)
    seen[path] = 1
    if (path in gen) next
    if (path in cap) {
        if (n <= max) {
            printf "%s: %d lines, within the %d-line limit; remove it from %s\n", path, n, max, file
            bad = 1
        } else if (n > cap[path]) {
            printf "%s: %d lines, grew past its baselined %d; split it instead\n", path, n, cap[path]
            bad = 1
        } else if (n < cap[path]) {
            printf "%s: %d lines, shrank from %d; lower its entry in %s to %d\n", path, n, cap[path], file, n
            bad = 1
        }
    } else if (n > max) {
        printf "%s: %d lines, over the %d-line limit\n", path, n, max
        bad = 1
    }
}
END {
    for (p in cap) if (!(p in seen)) {
        printf "%s: listed in %s but not a tracked file; remove the entry\n", p, file
        bad = 1
    }
    for (p in gen) if (!(p in seen)) {
        printf "%s: listed in %s but not a tracked file; remove the entry\n", p, file
        bad = 1
    }
    exit bad
}' "$baseline" "$lengths" || status=1

base_ok=1
if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
    echo "file-length-check: no '$base' ref; skipping the shrink-only comparison." >&2
    base_ok=0
fi

# The limit itself may only fall too: a raised `max_file_lines` would loosen the
# gate for every file that the baseline comparison below never sees.
if [ "$base_ok" -eq 1 ]; then
    base_max="$(git show "$base:.mise.toml" 2>/dev/null \
        | sed -n 's/^max_file_lines = "\([0-9][0-9]*\)"$/\1/p' || true)"
    if [ -z "$base_max" ]; then
        echo "file-length-check: $base sets no max_file_lines; skipping the limit comparison."
    elif [ "$max" -gt "$base_max" ]; then
        echo "max_file_lines: raised from $base_max to $max vs $base; the limit may only shrink"
        status=1
    fi
fi

if [ "$base_ok" -eq 0 ]; then
    :
elif ! git show "$base:$baseline" > "$base_baseline" 2>/dev/null; then
    echo "file-length-check: $base has no $baseline; skipping the shrink-only comparison."
else
    awk -v base="$base" -v file="$baseline" "$parse"'
    FNR == NR {
        if (!parse_line($0)) next
        if (kind == "generated") bgen[entry] = 1; else bcap[entry] = kind + 0
        next
    }
    {
        if (!parse_line($0)) next
        if (kind == "generated") {
            if (!(entry in bgen)) {
                printf "%s: new generated exclusion in %s; the baseline may only shrink\n", entry, file
                bad = 1
            }
        } else if (!(entry in bcap)) {
            printf "%s: new entry in %s; the baseline may only shrink\n", entry, file
            bad = 1
        } else if (kind + 0 > bcap[entry]) {
            printf "%s: cap raised from %d to %d vs %s; the baseline may only shrink\n", entry, bcap[entry], kind, base
            bad = 1
        }
    }
    END { exit bad }' "$base_baseline" "$baseline" || status=1
fi

if [ "$status" -eq 0 ]; then
    echo "file-length-check: every tracked file is within $max lines or its baselined length."
fi
exit "$status"
'''

# --- Mutation testing (cargo-mutants) ---

[tasks.mutants]
description = "Mutation-test only the lines changed vs trunk (pre-push + CI gate)"
tools = { "cargo:cargo-mutants" = "27.1.0" }
usage = 'arg "[base]" help="Base ref to diff against" default="origin/master"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
base="${usage_base:-origin/master}"
if ! git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
    if git rev-parse --verify --quiet "master^{commit}" >/dev/null; then
        base="master"
    else
        echo "mutants: no '$base' or 'master' ref found; skipping." >&2
        exit 0
    fi
fi
diff="$(mktemp)"
trap 'rm -f "$diff"' EXIT
git diff "$base"...HEAD -- '*.rs' > "$diff"
if [ ! -s "$diff" ]; then
    echo "mutants: no Rust changes vs $base; nothing to test."
    exit 0
fi
cargo mutants {{ vars.mutants_flags }} --in-diff "$diff"
'''

[tasks.mutants-all]
description = "Full-tree mutation test of the published crate (slow, may report gaps)"
tools = { "cargo:cargo-mutants" = "27.1.0" }
run = "cargo mutants {{ vars.mutants_flags }}"

# --- Commit message linting (Conventional Commits via convco) ---

# `--from-stdin` reads one message (convco otherwise walks history); `--strip`
# drops the comment/whitespace lines git leaves in the message file.
[tasks.commit-check]
description = "Lint a single commit message file (used by the commit-msg hook)"
tools = { "cargo:convco" = "0.6.4" }
usage = 'arg "<file>" help="Path to the commit message file"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
convco check --from-stdin --strip < "$usage_file"
'''

[tasks.commits-check]
description = "Lint that commits in <range> follow Conventional Commits (pre-push + CI)"
tools = { "cargo:convco" = "0.6.4" }
usage = 'arg "[range]" help="Commit range to lint" default="origin/master..HEAD"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
range="${usage_range:-origin/master..HEAD}"
# Resolve a base when origin/master isn't fetched (fresh clone / CI quirks),
# mirroring the `mutants` task's guard. Explicit ranges (CI) bypass this.
if [[ "$range" == "origin/master..HEAD" ]] \
   && ! git rev-parse --verify --quiet "origin/master^{commit}" >/dev/null; then
    if git rev-parse --verify --quiet "master^{commit}" >/dev/null; then
        range="master..HEAD"
    else
        echo "commits-check: no origin/master or master ref; skipping." >&2
        exit 0
    fi
fi
convco check "$range"
'''

# --- FFI bindings (geocoordinates-ffi) ---
# The tasks above are scoped to the published crate via `default-members`;
# the FFI crate is built/linted explicitly here.

[tasks.ffi-check]
description = "Lint the FFI bindings crate (warnings denied)"
run = "cargo clippy -p geocoordinates-ffi --all-targets -- -D warnings"

[tasks.bindings-build]
description = "Build the release cdylib the bindings are generated from"
run = "cargo build --release -p geocoordinates-ffi"

[tasks.bindings-generate]
description = "Generate <lang> bindings from the built cdylib (UniFFI library mode)"
hide = true
usage = 'arg "<lang>" help="UniFFI backend to generate"'
run = '''
#!/usr/bin/env bash
set -euo pipefail
# Shared library the bindings are generated from (OS-specific extension).
case "$(uname -s)" in
    Darwin) lib="target/release/libgeocoordinates_ffi.dylib" ;;
    *)      lib="target/release/libgeocoordinates_ffi.so" ;;
esac
cargo run -q -p geocoordinates-ffi --bin uniffi-bindgen -- \
    generate --library "$lib" --language "$usage_lang" --out-dir "bindings/$usage_lang"
'''

[tasks.bindings-python]
description = "Generate the Python bindings"
depends = ["bindings-build"]
run = "mise run bindings-generate python"

[tasks.bindings-kotlin]
description = "Generate the Kotlin bindings"
depends = ["bindings-build"]
run = "mise run bindings-generate kotlin"

[tasks.bindings-swift]
description = "Generate the Swift bindings"
depends = ["bindings-build"]
run = "mise run bindings-generate swift"

# Not a built-in UniFFI backend: builds the crate to wasm32 via wasm-pack.
# Requires the `wasm32-unknown-unknown` target, `wasm-pack`, and Node.js.
[tasks.bindings-web]
description = "Generate the TypeScript / WebAssembly bindings (uniffi-bindgen-react-native)"
dir = "{{ config_root }}/crates/geocoordinates-ffi/web"
run = ["npm install", "npm run build"]

# Java is served by the Kotlin/JVM artifact, so it has no separate generation.
[tasks.bindings]
description = "Generate bindings for every target language"
run = [
    "mise run bindings-python",
    "mise run bindings-kotlin",
    "mise run bindings-swift",
    "mise run bindings-web",
]
