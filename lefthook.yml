pre-commit:
  piped: true # Runs command groups sequentially by priority; same-priority commands run in parallel
  commands:
    format-fix:
      priority: 1
      glob: "**/*.rs"
      stage_fixed: true
      run: just fmt
    lint-fix:
      priority: 2
      glob: "**/*.rs"
      stage_fixed: true
      run: just lint-fix

commit-msg:
  commands:
    conventional:
      # {1} is the commit message file git passes to the hook.
      run: just commit-check {1}

pre-push:
  commands:
    commit-lint:
      run: just commits-check
    format-check:
      run: just fmt-check
    lint-check:
      run: just lint
    test:
      run: just test
    coverage:
      run: just coverage
    mutants:
      run: just mutants
