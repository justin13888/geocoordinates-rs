name: Release (Android Library)

on:
  schedule:
    - cron: "0 22 * * *" # Daily 06:00 Asia/Shanghai (22:00 UTC).
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/release-android.yml
      - .github/scripts/android-release*
      - crates/geocoordinates-ffi/android/**
      - crates/geocoordinates-ffi/src/**
      - crates/geocoordinates-ffi/Cargo.toml
      - src/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - LICENSE-MIT
      - LICENSE-APACHE

# Serialize scheduled/manual runs so planning, publication and retention agree.
concurrency:
  group: android-release-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release planning and retention
        run: node --test .github/scripts/android-release.test.cjs
      - uses: actions/github-script@v7
        id: plan
        with:
          script: |
            if (context.eventName === 'pull_request') {
              core.setOutput('changed', 'true');
              core.setOutput('sha', context.sha);
            } else {
              await require('./.github/scripts/android-release.cjs').plan({github, context, core});
            }

  build:
    needs: plan
    if: needs.plan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk28
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Google's repository no longer publishes the legacy `tools` package.
          packages: platform-tools
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate Android Kotlin bindings
        run: |
          set -euo pipefail
          cargo build --locked --release -p geocoordinates-ffi --lib
          cargo run --locked --release -p geocoordinates-ffi --bin uniffi-bindgen -- \
            generate --library target/release/libgeocoordinates_ffi.so \
            --language kotlin --no-format \
            --config crates/geocoordinates-ffi/android/uniffi.toml \
            --out-dir crates/geocoordinates-ffi/android/src/main/kotlin
      - name: Build Android native libraries (four ABIs)
        env:
          # Explicit 16 KB alignment, including for the 64-bit Android libraries.
          RUSTFLAGS: -C link-arg=-Wl,-z,max-page-size=16384
        run: |
          export ANDROID_NDK_HOME="${ANDROID_HOME}/ndk/28.2.13676358"
          cargo install cargo-ndk --version 4.1.2 --locked
          cargo ndk --platform 23 \
            -t arm64-v8a -t armeabi-v7a -t x86_64 -t x86 \
            -o crates/geocoordinates-ffi/android/src/main/jniLibs \
            build --locked --release -p geocoordinates-ffi --lib --no-default-features
      - name: Assemble and lint Android Library
        working-directory: crates/geocoordinates-ffi/android
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: gradle --no-daemon -PreleaseVersion="${RELEASE_VERSION:-0.0.0-local}" assembleRelease lintRelease
      - name: Verify AAR contents
        run: |
          python3 - <<'PY'
          import io
          import pathlib
          import zipfile
          aar, = pathlib.Path('crates/geocoordinates-ffi/android/build/outputs/aar').glob('*-release.aar')
          with zipfile.ZipFile(aar) as archive:
              for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64', 'x86'):
                  assert f'jni/{abi}/libgeocoordinates_ffi.so' in archive.namelist(), abi
              assert 'proguard.txt' in archive.namelist()
              with zipfile.ZipFile(io.BytesIO(archive.read('classes.jar'))) as classes:
                  assert 'uniffi/geocoordinates_ffi/Wgs84.class' in classes.namelist()
          print('Verified all four native ABIs, Kotlin bindings and consumer rules.')
          PY
      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p android-dist
          cp crates/geocoordinates-ffi/android/build/outputs/aar/*-release.aar android-dist/geocoordinates-android.aar
          cp crates/geocoordinates-ffi/android/README.md LICENSE-MIT LICENSE-APACHE android-dist/
          cd android-dist
          sha256sum geocoordinates-android.aar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: android-library
          path: android-dist/
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # PRs build only; dispatches must use the default branch to publish.
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: android-library
          path: android-dist
      - name: Publish Android Release after all assets upload
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.sha }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION"
          tag="$RELEASE_TAG"
          notes="${RUNNER_TEMP}/android-release-notes.md"
          cat > "$notes" <<EOF
          Android Library built from ${SOURCE_SHA} (Rust crate ${version}).

          <!-- android-library-release commit=${SOURCE_SHA} -->

          Download geocoordinates-android.aar and follow the attached README.md.
          Includes arm64-v8a, armeabi-v7a, x86_64 and x86; requires Android API 23+.
          JNA is a separate dependency (see README.md). SHA256SUMS verifies the AAR.
          Only the latest three Android Library releases are retained.
          EOF
          # A failed upload may have left this version's draft. Only resume a
          # draft with our ownership marker; never overwrite a published release.
          if gh release view "$tag" --json isDraft,body > "$RUNNER_TEMP/android-existing.json" 2>/dev/null; then
            jq -e '.isDraft and (.body | test("<!-- android-library-release commit=[a-f0-9]{40} -->"))' "$RUNNER_TEMP/android-existing.json" > /dev/null
            gh release edit "$tag" --title "Android Library ${version}" --notes-file "$notes"
          else
            gh release create "$tag" --target "$SOURCE_SHA" --draft \
              --title "Android Library ${version}" --notes-file "$notes"
          fi
          gh release upload "$tag" android-dist/* --clobber
          gh release edit "$tag" --draft=false --latest=false

  cleanup:
    needs: [plan, build, publish]
    # Retry retention even when an unchanged source tree skips today's build.
    # Never prune after a failed build/upload, or from PR/non-default branches.
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.publish.result == 'success' || needs.build.result == 'skipped') &&
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - name: Keep only the three newest Android Releases
        uses: actions/github-script@v7
        with:
          script: await require('./.github/scripts/android-release.cjs').prune({github, context, core});
