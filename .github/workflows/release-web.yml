name: Release (npm)

# Publishes the WebAssembly/TypeScript `geocoordinates` package to npm.
#
# Trigger: dispatched by release-plz.yml after it cuts the `v*` release (with
# `publish=true`). A manual `workflow_dispatch` (publish defaulting to false) builds
# + `npm pack`s without publishing (dry run).
#
# Auth: npm OIDC Trusted Publishing — no token/secret. npm exchanges the GitHub
# OIDC `id-token` for a short-lived publish credential and auto-attaches provenance.
# Configure the trusted publisher on npmjs.com (the `geocoordinates-rs` package
# Settings) for this repo + workflow `release-web.yml`. The npm package is named
# `geocoordinates-rs` (matching PyPI): the bare `geocoordinates` is blocked by
# npm's name-similarity filter (too close to the existing `geo-coordinates`).
# NOTE: OIDC cannot publish a package's FIRST version
# (the package must already exist to host the trusted-publisher config), so v0.1.1
# was bootstrapped with a one-time local `npm publish`; every release after is OIDC.
# Requires npm >= 11.5.1 and Node >= 22.14 (handled below).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0"
        required: false
      publish:
        description: "Publish to npm (set by release-plz; manual dispatch = dry run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build + publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    defaults:
      run:
        working-directory: crates/geocoordinates-ffi/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm
          cache-dependency-path: crates/geocoordinates-ffi/web/package-lock.json
      - name: Upgrade npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest
      - name: Compute version
        id: ver
        env:
          REF_VERSION: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="${REF_VERSION:-$INPUT_VERSION}"; V="${V#v}"
          if [ -z "$V" ]; then echo "::error::No version"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Set package version
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version
      - name: Build bindings
        run: npm run build
      # OIDC trusted publishing: no NODE_AUTH_TOKEN. npm exchanges the GitHub
      # `id-token` (permissions below) for a publish credential and attaches
      # provenance automatically. Requires the package to already exist on npm.
      - name: Publish to npm (OIDC trusted publishing)
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        run: npm publish --provenance --access public
      - name: Dry run (npm pack)
        if: ${{ !(github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        run: npm pack --dry-run
