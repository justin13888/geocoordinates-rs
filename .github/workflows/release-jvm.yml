name: Release (Maven Central)

# Publishes the JVM (Kotlin) bindings — the artifact Java also consumes — to
# Maven Central as io.github.justin13888:geocoordinates.
#
# Trigger: dispatched by release-plz.yml after it cuts the `v*` release (with
# `publish=true`), so the binding version tracks the Rust crate version. A manual
# `workflow_dispatch` (publish defaulting to false) only builds + assembles the JAR.
# The same dry run also runs on pull requests that touch this pipeline and weekly
# on a schedule, so the path is exercised between releases, not first at one.
#
# Auth (configure before the first release; see PUBLISHING.md):
#   secrets.MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD  — Central Portal token
#   secrets.GPG_SIGNING_KEY (ASCII-armored) / GPG_SIGNING_PASSWORD — artifact signing
# Until these are set, the `publish` job still runs and stages the natives built
# by the `natives` job, but on a real release the "Publish to Maven Central" step
# warns and exits 0 before gradle builds or publishes anything. The other
# registries are unaffected.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0"
        required: false
      publish:
        description: "Publish to Maven Central (set by release-plz; manual dispatch = dry run)"
        type: boolean
        default: false
  # Dry runs: neither event satisfies the publish condition (see
  # .github/actions/release-plan), so they only build + assemble. The version
  # falls back to the root crate's.
  pull_request:
    paths:
      - .github/workflows/release-jvm.yml
      - .github/actions/release-plan/**
      - .mise.toml
      - Cargo.toml
      - Cargo.lock
      - crates/geocoordinates-ffi/**
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: catches runner/toolchain/action drift

# Cancel superseded PR dry runs; every other run (release, dispatch, schedule) gets
# a unique group, so a release is never cancelled or held pending behind another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Cross-build the cdylib for every JVM-supported platform, named by JNA's
  # `<os>-<arch>` resource convention.
  natives:
    name: native ${{ matrix.jna }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, jna: linux-x86-64, lib: libgeocoordinates_ffi.so }
          - { runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, jna: linux-aarch64, lib: libgeocoordinates_ffi.so, cross: true }
          - { runner: macos-14, target: aarch64-apple-darwin, jna: darwin-aarch64, lib: libgeocoordinates_ffi.dylib }
          # Cross-build the Intel dylib on the arm64 runner: GitHub's Intel
          # macos-13 runners are being retired and queue indefinitely. The arm64
          # Apple toolchain links x86_64-apple-darwin natively, so no Intel runner.
          - { runner: macos-14, target: x86_64-apple-darwin, jna: darwin-x86-64, lib: libgeocoordinates_ffi.dylib }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, jna: win32-x86-64, lib: geocoordinates_ffi.dll }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Set up aarch64 cross linker
        if: matrix.cross
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build cdylib
        run: cargo build --release -p geocoordinates-ffi --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.jna }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib }}

  publish:
    name: Assemble JAR + publish
    needs: natives
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/geocoordinates-ffi/jvm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.13 # keep in step with ci.yml's pin
      - name: Plan release (version + publish)
        id: plan
        uses: ./.github/actions/release-plan
      # The same `mise run` task contributors and ffi.yml use, then staged into
      # the Gradle source set (the generated tree already carries its package path).
      - name: Generate Kotlin bindings
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mise run bindings-kotlin
          mkdir -p crates/geocoordinates-ffi/jvm/src/main/kotlin
          cp -R bindings/kotlin/. crates/geocoordinates-ffi/jvm/src/main/kotlin/
      - name: Download native libraries
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: ${{ github.workspace }}/natives
      - name: Stage natives into JNA resource layout
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          base=crates/geocoordinates-ffi/jvm/src/main/resources
          for dir in natives/native-*; do
            jna="${dir#natives/native-}"
            mkdir -p "$base/$jna"
            cp "$dir"/* "$base/$jna/"
          done
          find "$base" -type f | sort
      - name: Assemble JAR (dry run)
        if: ${{ steps.plan.outputs.publish != 'true' }}
        run: gradle -PreleaseVersion="${{ steps.plan.outputs.version }}" build
      - name: Publish to Maven Central
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          if [ -z "${ORG_GRADLE_PROJECT_mavenCentralUsername:-}" ]; then
            echo "::warning::Maven Central credentials not set — skipping publish. Configure Sonatype Central Portal + GPG secrets to enable."
            exit 0
          fi
          gradle -PreleaseVersion="${{ steps.plan.outputs.version }}" \
            publishToMavenCentral --no-configuration-cache
