name: FFI

on:
  push:
    branches: [master]
  pull_request:
  # Release-plz dispatches this on its release PR branch: that PR is opened with the
  # default GITHUB_TOKEN, so its `pull_request` runs stop at `action_required` (see
  # release-plz.yml).
  workflow_dispatch:

# Cancel superseded PR runs (a new push to the same PR cancels the in-flight one);
# never cancel push/master runs so post-merge history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # cdylib produced by the FFI crate on the Linux runners.
  FFI_LIB: target/release/libgeocoordinates_ffi.so

jobs:
  # Lint and test the FFI crate, build the cdylib, and confirm bindings generate for the
  # built-in UniFFI backends. Every step runs the same `mise run` task contributors
  # use (see .mise.toml). A missing formatter (ktlint, swift-format) only warns, so
  # generation does not depend on one being installed. Kotlin/Swift are
  # generate-validated only here; Swift is compiled on macOS in the `swift-build`
  # job below. Java is served by the Kotlin/JVM artifact, so it has no separate
  # generation step. TypeScript/WASM is built in the `web-wasm` job below
  # (external `ubrn` toolchain).
  build-and-bind:
    name: Build cdylib + generate bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.13 # keep in step with ci.yml's pin
      - name: Clippy (ffi crate)
        run: mise run ffi-check
      - name: Test (ffi crate)
        run: mise run ffi-test
      - name: Build cdylib
        run: mise run bindings-build
      - name: Generate bindings for the built-in backends
        run: |
          set -euo pipefail
          for lang in python kotlin swift; do
            echo "::group::generate $lang"
            mise run "bindings-$lang"
            echo "::endgroup::"
          done
      # The Swift source is committed (SwiftPM resolves the package from git),
      # while release-swift.yml regenerates it only on a release tag. Fail when
      # the committed copy no longer matches what the current FFI crate generates.
      - name: Check committed Swift bindings are up to date
        run: |
          committed=swift/Sources/GeoCoordinates/geocoordinates_ffi.swift
          # Printed literally (single quotes) for the developer's shell, which
          # picks the cdylib extension the way the bindings-generate mise task
          # does: .dylib on macOS, .so elsewhere.
          lib='target/release/libgeocoordinates_ffi.$(if [ "$(uname -s)" = Darwin ]; then echo dylib; else echo so; fi)'
          if ! diff -u "$committed" bindings/swift/geocoordinates_ffi.swift; then
            echo "::error file=$committed::Committed Swift bindings are stale. Regenerate with: mise run bindings-build && cargo run -q -p geocoordinates-ffi --bin uniffi-bindgen -- generate --no-format --library \"$lib\" --language swift --out-dir bindings/swift && cp bindings/swift/geocoordinates_ffi.swift $committed"
            exit 1
          fi

  # Functional smoke test of the Python bindings: import the generated module,
  # run a China conversion, check an Approx bound, and exercise the error path.
  python-smoke:
    name: Python smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.13 # keep in step with ci.yml's pin
      - name: Build cdylib + generate Python bindings
        run: mise run bindings-python
      - name: Smoke test
        run: |
          cp "$FFI_LIB" bindings/python/
          python crates/geocoordinates-ffi/tests/smoke.py

  # Build the TypeScript/WebAssembly bindings end-to-end: generate via `ubrn`,
  # compile the wasm wrapper crate, run wasm-bindgen (wasm-pack), and type-check
  # the result against @ubjs/core + the wasm typings (all driven by build.sh),
  # then run the Node behavioural tests against the built wasm.
  # RUSTFLAGS is relaxed here: the generated wrapper crate and the wasm builds of
  # third-party deps are not where we enforce -D warnings (the FFI crate's own
  # lint is covered by the clippy step above).
  web-wasm:
    name: Build WASM/TypeScript bindings
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          # Pinned: the action's `latest` lookup can silently resolve to v0.9.1,
          # whose bundled wasm-opt rejects modern multi-table wasm and fails the build.
          version: v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/geocoordinates-ffi/web/package-lock.json
      - name: Install npm deps
        working-directory: crates/geocoordinates-ffi/web
        run: npm ci
      - name: Build bindings (generate + wasm-pack + type-check)
        working-directory: crates/geocoordinates-ffi/web
        run: npm run build
      - name: Assert expected outputs exist
        working-directory: crates/geocoordinates-ffi/web
        run: |
          test -f src/index.web.ts
          test -f src/generated/web/geocoordinates_ffi.ts
          test -f src/generated/web/wasm-bindgen/index.js
          test -f src/generated/web/wasm-bindgen/index_bg.wasm
          echo "WASM/TypeScript bindings generated and type-checked."
      # Load the built wasm in Node and exercise conversions, approximate bounds,
      # and the typed GeoError variants (test/bindings.test.ts).
      - name: Behavioural tests (Node)
        working-directory: crates/geocoordinates-ffi/web
        run: npm test

  # Build the JVM (Kotlin) bindings and test them from both languages: generate
  # the Kotlin, then run the Gradle JUnit suites that load the cdylib via JNA -
  # SmokeTest.java proves the API is callable idiomatically from Java (Java
  # consumes the Kotlin artifact), and BindingsTest.kt exercises conversions,
  # approximate bounds, and each typed GeoException subclass. The host cdylib is
  # loaded via UniFFI's libraryOverride hook so the tests need no per-platform
  # resource staging.
  jvm-smoke:
    name: JVM (Kotlin/Java) smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11"
      - uses: jdx/mise-action@v2
        with:
          version: 2026.9.13 # keep in step with ci.yml's pin
      # Same staging as release-jvm.yml: the mise task, then copied into the
      # Gradle source set (the generated tree already carries its package path).
      - name: Build cdylib + generate Kotlin bindings
        run: |
          set -euo pipefail
          mise run bindings-kotlin
          mkdir -p crates/geocoordinates-ffi/jvm/src/main/kotlin
          cp -R bindings/kotlin/. crates/geocoordinates-ffi/jvm/src/main/kotlin/
      - name: Gradle test (Kotlin behaviour + Java consumption)
        working-directory: crates/geocoordinates-ffi/jvm
        env:
          GEOCOORDINATES_NATIVE_LIB: ${{ github.workspace }}/${{ env.FFI_LIB }}
        run: gradle test

  # Compile the Swift bindings on every PR, so Swift breakage surfaces here rather
  # than in release-swift.yml after a tag is cut. Runs the same
  # build-xcframework.sh the release uses (all Apple slices + freshly generated
  # Swift sources), then builds the root Package.swift against that local
  # XCFramework instead of the release URL and runs its XCTest suite
  # (swift/Tests/GeoCoordinatesTests: conversions, approximate bounds, and each
  # typed GeoError case).
  swift-build:
    name: Swift package build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build XCFramework + generate Swift sources
        run: bash crates/geocoordinates-ffi/swift/build-xcframework.sh
      - name: Swift build (local XCFramework)
        env:
          GEOCOORDINATES_LOCAL_XCFRAMEWORK: "1"
        run: swift build
      - name: Swift test (local XCFramework)
        env:
          GEOCOORDINATES_LOCAL_XCFRAMEWORK: "1"
        run: swift test
