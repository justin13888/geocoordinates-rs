name: Release-plz

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Release unpublished versions (runs after a release PR is merged to master).
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push tags, create GitHub releases
      pull-requests: read # detect the release PR
      id-token: write # OIDC token exchange for crates.io Trusted Publishing
      actions: write # dispatch the per-language binding release workflows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Kick off the per-language binding publishes (release-jvm/python/web/swift).
      #
      # We cannot rely on those workflows' `release: published` trigger: GitHub does
      # not fire workflow events for actions taken with the default GITHUB_TOKEN, so
      # the release release-plz just created would never start them. Dispatching is the
      # documented exception — `workflow_dispatch` always creates a run, even from the
      # default token — so this needs NO PAT or other stored/expiring secret. We pass
      # the released tag + version (and publish=true) so each workflow publishes the
      # matching code instead of dry-running.
      - name: Dispatch binding release workflows
        if: ${{ steps.release-plz.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -uo pipefail
          tag=$(printf '%s' "$RELEASES" | jq -r '.[0].tag')
          version=$(printf '%s' "$RELEASES" | jq -r '.[0].version')
          [ -n "$tag" ] && [ "$tag" != "null" ] || { echo "::error::no tag in release output"; exit 1; }
          echo "Dispatching binding workflows for tag=$tag version=$version"
          rc=0
          for wf in release-jvm.yml release-python.yml release-web.yml release-swift.yml; do
            if gh workflow run "$wf" --ref "$tag" -f version="$version" -f publish=true; then
              echo "dispatched $wf"
            else
              echo "::warning::failed to dispatch $wf"; rc=1
            fi
          done
          exit $rc

  # Maintain the release PR (version bump + CHANGELOG) as commits land on master.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the release PR branch (release-plz, and the npm version stamp)
      pull-requests: write # create/update the release PR
      actions: write # dispatch CI, FFI, and the binding dry runs on the release PR branch
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        id: release-plz
        uses: release-plz/action@v0.5.130
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The steps below run whenever this run created or updated the release PR.
      # Despite its name, the action's `prs_created` output is `true` in both
      # cases: it is set from `prs`, the list of release PRs release-plz opened or
      # pushed to, and is `false` only when release-plz left no PR behind.
      - name: Resolve the release PR branch
        id: release-pr
        if: ${{ steps.release-plz.outputs.prs_created == 'true' }}
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          set -euo pipefail
          branch=$(printf '%s' "$PR" | jq -r '.head_branch')
          [ -n "$branch" ] && [ "$branch" != "null" ] || { echo "::error::no head_branch in release-plz pr output"; exit 1; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v2
        if: ${{ steps.release-pr.outputs.branch }}
        with:
          version: 2026.9.13 # keep in step with ci.yml's pin
      # release-plz bumps only Cargo.toml's workspace version. Stamp the npm
      # manifest from it on the release branch (`mise run version-sync`), so CI's
      # `version-check` passes there and the release ships one version. The push
      # uses the default token, so it starts no workflow of its own; the dispatch
      # below runs everything at the new head.
      - name: Stamp binding versions on the release PR branch
        if: ${{ steps.release-pr.outputs.branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "refs/heads/$BRANCH"
          git switch --quiet --detach FETCH_HEAD
          mise run version-sync
          if git diff --quiet; then
            echo "npm manifest already carries the workspace version"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet --all -m "chore(release): stamp the npm manifest with the workspace version"
          git push --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          echo "pushed $(git rev-parse HEAD) to $BRANCH"
      # Run CI, FFI, and the four binding release dry runs on the release PR's head.
      #
      # The release PR is opened and pushed with the default GITHUB_TOKEN, so the
      # `pull_request` runs it triggers are held at `action_required` (actor
      # github-actions[bot]) and never execute a job. Dispatching is the same
      # documented exception the release job relies on: it runs at once, needs no PAT,
      # and its check runs land on the branch head, so they show on the PR. The
      # release workflows dispatched without `publish=true` are dry runs that build
      # and package the bumped version (see .github/actions/release-plan), so the
      # packaging is exercised before the release PR merges, not first after it.
      - name: Dispatch CI, FFI, and binding dry runs on the release PR branch
        if: ${{ steps.release-pr.outputs.branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          set -uo pipefail
          echo "Dispatching on $BRANCH"
          rc=0
          for wf in ci.yml ffi.yml release-jvm.yml release-python.yml release-web.yml release-swift.yml; do
            if gh workflow run "$wf" --ref "$BRANCH"; then
              echo "dispatched $wf"
            else
              echo "::warning::failed to dispatch $wf"; rc=1
            fi
          done
          exit $rc
