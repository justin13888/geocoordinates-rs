name: Release (SwiftPM)

# Builds the XCFramework for `geocoordinates` and wires it into the root
# Package.swift for Swift Package Manager.
#
# Trigger: dispatched by release-plz.yml after it cuts the `v*` release (with
# `publish=true`). A manual `workflow_dispatch` (publish defaulting to false) builds
# the XCFramework and rewrites Package.swift locally without publishing (dry run).
# The same dry run also runs on pull requests that touch this pipeline and weekly
# on a schedule, so the path is exercised between releases, not first at one.
#
# No external account: SwiftPM resolves from the git tag + the GitHub Release.
# Because a binaryTarget checksum is self-referential (it depends on the built
# zip), the job uploads the zip to the release, writes the URL + checksum into
# Package.swift, commits, and re-points the tag at that commit so SwiftPM sees a
# matching manifest.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0 (names the tag a dry run rewrites Package.swift against)"
        required: false
      publish:
        description: "Upload to the release + re-point the tag (set by release-plz; manual dispatch = dry run)"
        type: boolean
        default: false
  # Dry runs: neither event satisfies the publish condition (see
  # .github/actions/release-plan), so they build the XCFramework and rewrite
  # Package.swift in the runner's checkout only.
  pull_request:
    paths:
      - .github/workflows/release-swift.yml
      - .github/actions/release-plan/**
      - Cargo.toml
      - Cargo.lock
      - crates/geocoordinates-ffi/**
      - Package.swift
      - swift/**
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: catches runner/toolchain/action drift

# Cancel superseded PR dry runs; every other run (release, dispatch, schedule) gets
# a unique group, so a release is never cancelled or held pending behind another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  xcframework:
    name: Build + publish XCFramework
    runs-on: macos-14
    permissions:
      contents: write # upload the release asset, re-point the tag
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Plan release (version + publish)
        id: plan
        uses: ./.github/actions/release-plan
      - name: Build XCFramework
        id: xcf
        run: bash crates/geocoordinates-ffi/swift/build-xcframework.sh
      # Runs on dry runs too, so the checksum rewrite is exercised before a release
      # depends on it; only the step below uploads, commits, or moves a tag.
      - name: Rewrite Package.swift binaryTarget (URL + checksum)
        id: pkg
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
          # On a release event this is the release tag; on a release-plz dispatch the
          # workflow runs at `--ref <tag>`, so ref_name is that same tag.
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          VERSION: ${{ steps.plan.outputs.version }}
          CHECKSUM: ${{ steps.xcf.outputs.checksum }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" = true ]; then
            TAG="$RELEASE_TAG"
          else
            # Dry run: no release exists, so rewrite against the tag it would have.
            TAG="v$VERSION"
          fi
          if ! printf '%s' "$CHECKSUM" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::build-xcframework.sh emitted no valid checksum: '$CHECKSUM'"; exit 1
          fi
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/geocoordinates_ffiFFI.xcframework.zip"
          perl -0pi -e "s{url: \"[^\"]*geocoordinates_ffiFFI\\.xcframework\\.zip\"}{url: \"${URL}\"}" Package.swift
          perl -0pi -e "s{checksum: \"[0-9a-f]{64}\"}{checksum: \"${CHECKSUM}\"}" Package.swift
          # A pattern that stops matching would otherwise leave the old values in place silently.
          grep -qF "url: \"${URL}\"" Package.swift || { echo "::error::Package.swift URL was not rewritten"; exit 1; }
          grep -qF "checksum: \"${CHECKSUM}\"" Package.swift || { echo "::error::Package.swift checksum was not rewritten"; exit 1; }
          git diff -- Package.swift
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Publish to the release + re-point tag
        if: ${{ steps.plan.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" swift/geocoordinates_ffiFFI.xcframework.zip --clobber
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift swift/Sources/GeoCoordinates
          git commit -m "chore(swift): XCFramework + checksum for ${TAG}"
          # Re-point the tag so SwiftPM resolves a manifest with the real checksum.
          git tag -f "$TAG"
          git push -f origin "$TAG"
