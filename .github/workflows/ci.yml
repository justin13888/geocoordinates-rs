name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded PR runs (a new push to the same PR cancels the in-flight one);
# never cancel push/master runs so post-merge history stays complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the base..head range resolves
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2 # installs `convco` (cargo backend) from .mise.toml
      - name: Lint commit messages (Conventional Commits)
        run: just commits-check "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --all-features

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # No --fail-under-lines threshold yet; this reports coverage only.
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  mutants:
    name: Mutation tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "" # override the workflow-level `-D warnings`: warn-only mutants must
        # still build to be evaluated, else they count as unviable not missed.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so merge-base / --in-diff works
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v2 # installs `just` + `cargo-mutants` from .mise.toml
      - name: Mutation-test changed lines
        run: just mutants "origin/${{ github.base_ref || 'master' }}"
