name: Release (PyPI)

# Publishes the Python wheels for `geocoordinates` (the UniFFI bindings) to PyPI.
#
# Trigger: dispatched by release-plz.yml after it cuts the `v*` release (with
# `publish=true`), so the binding version tracks the Rust crate version. A manual
# `workflow_dispatch` (publish defaulting to false) builds the wheels without publishing.
# The same dry run also runs on pull requests that touch this pipeline and weekly
# on a schedule, so the path is exercised between releases, not first at one.
#
# Auth: PyPI Trusted Publishing (OIDC) — no token. Configure a trusted publisher on
# PyPI for this repo + workflow file `release-python.yml` (a "pending publisher"
# works before the first release).
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.1.0"
        required: false
      publish:
        description: "Publish to PyPI (set by release-plz; manual dispatch = test build only)"
        type: boolean
        default: false
  # Dry runs: neither event satisfies the publish job's condition, so they only
  # build wheels. The version falls back to the root crate's (see "Prepare manifests").
  pull_request:
    paths:
      - .github/workflows/release-python.yml
      - Cargo.toml
      - Cargo.lock
      - crates/geocoordinates-ffi/**
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC: catches runner/toolchain/action drift

# Cancel superseded PR dry runs; every other run (release, dispatch, schedule) gets
# a unique group, so a release is never cancelled or held pending behind another run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Wheel (${{ matrix.runner }} ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64 }
          - { runner: ubuntu-latest, target: aarch64 }
          # Cross-build the Intel wheel on the arm64 runner: GitHub's Intel
          # macos-13 runners are being retired and queue indefinitely. The arm64
          # macOS toolchain targets x86_64-apple-darwin natively (same as the
          # Swift XCFramework build), so this needs no Intel runner.
          - { runner: macos-14, target: x86_64 }
          - { runner: macos-14, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - name: Prepare manifests (version + maturin bindgen scope)
        shell: bash
        env:
          REF_VERSION: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          VERSION="${REF_VERSION:-$INPUT_VERSION}"
          # PR / scheduled dry runs carry no tag or input: use the root crate version,
          # which is what release-plz would pass.
          if [ -z "$VERSION" ] && { [ "$EVENT" = pull_request ] || [ "$EVENT" = schedule ]; }; then
            VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          fi
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::No version (provide one via workflow_dispatch input)"; exit 1
          fi
          # Stamp the FFI crate version from the release tag (package line only).
          perl -i -pe 's/^version = "[^"]*"/version = "'"$VERSION"'"/' \
            crates/geocoordinates-ffi/Cargo.toml
          # maturin runs `cargo run --bin uniffi-bindgen` from the workspace root,
          # where the bin otherwise resolves to the core package. Point
          # default-members at the FFI crate so it resolves. (Ephemeral; the
          # committed manifest keeps default-members = ["."] for core CI.)
          perl -i -pe 's{^default-members = .*}{default-members = ["crates/geocoordinates-ffi"]}' \
            Cargo.toml
          echo "Building geocoordinates $VERSION"
          grep -m1 '^version' crates/geocoordinates-ffi/Cargo.toml
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
          sccache: "true"
          working-directory: crates/geocoordinates-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.runner }}-${{ matrix.target }}
          path: crates/geocoordinates-ffi/dist

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Publish on a real release, or a release-plz dispatch with publish=true; a plain
    # manual workflow_dispatch is a build-only dry run.
    if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    permissions:
      id-token: write # OIDC for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
