# Python packaging for the UniFFI bindings, built with maturin.
#
# maturin has first-class UniFFI support (`bindings = "uniffi"`): it builds the
# crate's cdylib and bundles it with the generated Python module, which loads the
# library at runtime via `ctypes`. Because it is ctypes-based (not the CPython
# C-API), one wheel works across all CPython/PyPy versions — abi3 does not apply.
#
# The distribution is `geocoordinates-rs` (the bare `geocoordinates` is taken on
# PyPI by an unrelated project); the importable module is the UniFFI namespace
# `geocoordinates_ffi` (`import geocoordinates_ffi as gc`).
#
# The version is the FFI crate's, which inherits the workspace version in the root
# Cargo.toml (`[workspace.package] version`); the release workflow stamps that line
# from the release tag before building. `mise run version-check` fails if a static
# `version` appears here.
[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "geocoordinates-rs"
description = "Low-level geospatial coordinate primitives: China datums (GCJ-02/BD-09), datum transforms, DMS/DDM angles, coordinate parsing and formatting, geodesics, local frames (ECEF/ENU/NED/AER), UTM/UPS/MGRS, grid codes (Geohash, Plus Code, Maidenhead, H3, S2), and GeoJSON/WKT/GPX/KML/NMEA ingestion."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "Justin Chung" }]
keywords = ["gis", "geo", "coordinates", "gcj02", "geodesy"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/justin13888/geocoordinates-rs"

[tool.maturin]
bindings = "uniffi"
